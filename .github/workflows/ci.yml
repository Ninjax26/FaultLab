name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: faultlab_test
          POSTGRES_USER: faultlab
          POSTGRES_PASSWORD: faultlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faultlab -d faultlab_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://faultlab:faultlab@127.0.0.1:5432/faultlab_test
      FAULTLAB_DATABASE_URL: postgresql+asyncpg://faultlab:faultlab@127.0.0.1:5432/faultlab_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-worker/go.mod
          cache-dependency-path: go-worker/go.sum
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Install locked Python dependencies
        run: uv sync --frozen --no-editable
      - name: Python lint and type check
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/mypy src
      - name: Go tests and formatting
        working-directory: go-worker
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
      - name: Migration smoke test
        run: .venv/bin/alembic upgrade head
      - name: Unit and PostgreSQL integration tests
        run: .venv/bin/pytest -q
